<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <circle cx="50" cy="50" r="48" fill="#141414" stroke="#F59E0B" stroke-width="4" />
  <circle cx="50" cy="50" r="44" fill="#1E1E1E" stroke="#D97706" stroke-width="2" stroke-dasharray="4,2" />
  
  <!-- Hour markers -->
  <line x1="50" y1="12" x2="50" y2="18" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
  <line x1="88" y1="50" x2="82" y2="50" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="88" x2="50" y2="82" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
  <line x1="12" y1="50" x2="18" y2="50" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />

  <!-- Madame Minute Retro Clock Hands -->
  <line x1="50" y1="50" x2="50" y2="26" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" />
  <line x1="50" y1="50" x2="70" y2="50" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
  
  <!-- Clock Center Pivot -->
  <circle cx="50" cy="50" r="5" fill="#F59E0B" stroke="#141414" stroke-width="1.5" />
</svg>
